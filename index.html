<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Словочит</title>
<meta name="description" content="Читайте книги на английском и учите слова: перевод по нажатию, словарь, карточки и уроки. Работает без интернета.">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Словочит">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-cyrillic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="main" class="wrap"></main>
<div class="tabs"><nav id="tabs" aria-label="Разделы">
  <button class="tab" data-tab="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg>Книги</button>
  <button class="tab" data-tab="dict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="15" height="18" rx="2.5"/><path d="M9 8h6M9 12h4"/></svg>Словарь<span class="badge" id="dueBadge" hidden></span></button>
  <button class="tab" data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3.5 2.5 8.5 2.5 12 0v-5"/></svg>Уроки</button>
  <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Профиль</button>
</nav></div>
<section class="layer paper" id="reader" aria-label="Чтение"></section>
<section class="layer" id="layer" aria-label="Экран"></section>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab" id="grab"><i></i></div><div class="sbody" id="sbody"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="update" id="update" hidden>Есть обновление<button class="btn primary sm" id="updBtn">Обновить</button></div>
<input type="file" id="file" accept=".txt,.epub,.fb2,.pdf,.html,.htm,.md,text/plain,application/epub+zip,application/pdf" hidden>
<input type="file" id="restore" accept=".json,application/json" hidden>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
